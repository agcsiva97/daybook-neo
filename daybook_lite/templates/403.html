{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>403 - Access Forbidden | Daybook Lite</title>
    <link href="{% static 'css/all.min.css' %}" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Hanuman:wght@100;300;400;700;900&display=swap');
        
        :root {
            --daybook-primary: #4A7766;
            --error-color: #dc3545;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Hanuman', Arial, sans-serif;
            background-color: #FFF;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        
        .error-container {
            text-align: center;
            max-width: 600px;
            animation: fadeIn 0.5s ease-in;
        }
        
        .error-code {
            font-size: 6rem;
            font-weight: 900;
            color: var(--error-color);
            margin-bottom: 1rem;
            line-height: 1;
        }
        
        h1 {
            font-size: 2.5rem;
            color: #333;
            margin-bottom: 1rem;
            font-weight: 700;
        }
        
        p {
            font-size: 1.125rem;
            color: #666;
            margin-bottom: 2rem;
            line-height: 1.6;
        }
        
        .btn-group {
            display: flex;
            gap: 1rem;
            justify-content: center;
            flex-wrap: wrap;
        }
        
        .btn {
            display: inline-block;
            padding: 12px 30px;
            font-size: 1rem;
            font-weight: 600;
            text-decoration: none;
            border-radius: 5px;
            transition: all 0.3s ease;
            cursor: pointer;
            border: none;
            font-family: 'Hanuman', Arial, sans-serif;
        }
        
        .btn-primary {
            background-color: var(--daybook-primary);
            color: white;
        }
        
        .btn-primary:hover {
            background-color: #3a5f52;
        }
        
        .btn-secondary {
            background-color: #6c757d;
            color: white;
        }
        
        .btn-secondary:hover {
            background-color: #5a6268;
        }
        
        .footer-text {
            margin-top: 2rem;
            font-size: 0.875rem;
            color: #999;
        }
        
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>
<body>
    <div class="error-container">
        <img src="{% static 'img/403-error.PNG' %}" width="400px" class="img-fluid">
        <h1>Access Forbidden</h1>
        <p>
            Hi, {{ user.first_name }} {{ user.last_name}} You don't have permission to access this page. This action is restricted to Admin users only.
        </p>
        
        <div class="btn-group">
            <a href="/" class="btn btn-primary">
                <i class="fa-solid fa-house"></i> Go to Home
            </a>
            <button onclick="window.history.back()" class="btn btn-secondary">
                ← Go Back
            </button>
        </div>
        
        <p class="footer-text">
            If you believe this is an error, please contact your administrator.
        </p>
    </div>
</body>
</html>
