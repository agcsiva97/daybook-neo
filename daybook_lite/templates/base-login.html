<!doctype html>
{% load static %}
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Daybook neo | Login</title>
    <link href="{% static 'css/bootstrap.min.css' %}" rel="stylesheet">
    <link href="{% static 'css/all.min.css' %}" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/daybook-theme.css' %}?v=20260208135618">
  </head>
  <body>
    <main>
        {% block content %}{% endblock %}
    </main>

    <!-- Toast Container -->
    <div class="toast-container position-fixed bottom-0 start-0 p-3" style="z-index: 9999">
      {% if messages %}
        {% for message in messages %}
          <div class="toast align-items-center border-0" role="alert" aria-live="assertive" aria-atomic="true" data-bs-autohide="true" data-bs-delay="5000">
            <div class="toast-header text-bg-danger">
              <i class="fa-solid fa-book me-2"></i>
              <span class="hanuman-600">Daybook</span><span class="hanuman-100" style="font-style:italic;font-size:small;">lite</span>
              <small class="ms-auto text-body-dark">just now</small>
              <button type="button" class="btn btn-link p-0 ms-2 text-white" data-bs-dismiss="toast" aria-label="Close" style="text-decoration: none; font-size: 1.2em;">
                <i class="fa-solid fa-circle-xmark"></i>
              </button>
            </div>
            <div class="toast-body text-bg-danger">
              {{ message }}
            </div>
          </div>
        {% endfor %}
      {% endif %}
    </div>

    <script src="{% static 'js/bootstrap.bundle.min.js' %}"></script>
    <script>
      // Auto-show toasts on page load
      document.addEventListener('DOMContentLoaded', function() {
        var toastElList = [].slice.call(document.querySelectorAll('.toast'));
        toastElList.map(function(toastEl) {
          var toast = new bootstrap.Toast(toastEl);
          toast.show();
          return toast;
        });
      });
    </script>
  </body>
</html>
